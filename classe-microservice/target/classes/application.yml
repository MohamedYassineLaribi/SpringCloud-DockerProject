server:
  port: 8080

spring:
  # Doit correspondre EXACTEMENT au nom du fichier dans Config Server (classe.yml)
  application:
    name: classe

  # Définit le profil par défaut (Config Server cherchera classe-prod.yml puis classe.yml)
  profiles:
    active: prod

  # -------------------------------------------------------
  # Import de la configuration distante depuis Config Server
  # (PARTIE 10)
  # optional: signifie que l'appli démarre même si Config Server est indisponible
  # -------------------------------------------------------
  config:
    import: "optional:configserver:http://localhost:9999/"

  datasource:
    url: 'jdbc:h2:mem:classedb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# -------------------------------------------------------
# Actuator : expose /actuator/refresh pour mettre à jour
# la configuration à chaud sans redémarrer le microservice
# -------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
